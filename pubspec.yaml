name: idle_nightclub
description: Jeu de gestion de boîte de nuit
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    # Le vrai nom de ton image !
    - assets/icon.png

flutter_launcher_icons:
  ios: true
  # Le chemin exact pointant vers la bonne image
  image_path: "assets/icon.png"
  remove_alpha_ios: true


