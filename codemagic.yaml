workflows:
  ios-unsigned-ipa:
    name: idle_nightclub
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: 1. Nettoyage et préparation
        script: |
          echo "Suppression totale du dossier iOS pour éviter toute corruption..."
          rm -rf ios pubspec.lock
          flutter clean
          
      - name: 2. Recréation d'un projet iOS propre
        script: |
          echo "Création d'un environnement iOS natif flambant neuf..."
          flutter create . --platforms ios
          
      - name: 3. Installation des dépendances
        script: |
          flutter pub get
          
      - name: 4. Application de l'icône du jeu (icon.png)
        script: |
          if [ -f "assets/icon.png" ]; then
            echo "✅ Image icon.png trouvée, injection dans Xcode..."
            dart run flutter_launcher_icons
          else
            echo "⚠️ assets/icon.png introuvable. On garde l'icône par défaut."
          fi
          
      - name: 5. Compilation rapide (Sans signature)
        script: |
          echo "Désactivation des sécurités Apple dans Xcode..."
          sed -i '' 's/DevelopmentTeam = .*/DevelopmentTeam = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          
          echo "Démarrage de la compilation ultra-rapide..."
          # L'option -v permet de voir exactement ce qu'il se passe si ça bloque
          flutter build ios --release --no-codesign -v
          
      - name: 6. Création de l'archive (.ipa)
        script: |
          echo "Mise en paquet pour Sideloadly..."
          mkdir -p build/ios/ipa/Payload
          
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          else
            cp -R build/ios/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          fi
          
          cd build/ios/ipa
          zip -r -q idle_nightclub.ipa Payload
          rm -rf Payload
          
          echo "🎉 Fichier idle_nightclub.ipa prêt !"
          
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - test@example.com # Pense à mettre ton mail ici
        notify:
          success: true
          failure: true


