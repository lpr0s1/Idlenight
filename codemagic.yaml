workflows:
  ios-unsigned-ipa:
    name: idle_nightclub
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: 1. Nettoyage absolu (Destruction des erreurs)
        script: |
          echo "Suppression totale des anciens fichiers et caches..."
          rm -rf ios pubspec.lock
          flutter clean
          
      - name: 2. Recréation du projet iOS
        script: |
          echo "Création d'un projet iOS pur, vierge et sans corruption..."
          flutter create . --platforms ios
          
      - name: 3. Télécharger les dépendances
        script: |
          flutter pub get
          
      - name: 4. Génération de l'icône sécurisée
        script: |
          echo "Vérification de l'image icon.png..."
          # On cherche désormais le bon fichier : icon.png
          if [ -f "assets/icon.png" ]; then
            echo "✅ Image trouvée, génération des icônes iOS..."
            dart run flutter_launcher_icons
          else
            echo "⚠️ AVERTISSEMENT : 'assets/icon.png' introuvable."
            echo "Assure-toi de l'avoir uploadé dans le dossier 'assets' sur Github !"
          fi
          
      - name: 5. Compilation iOS (Sans signature)
        script: |
          echo "Désactivation manuelle de la signature dans Xcode..."
          sed -i '' 's/DevelopmentTeam = .*/DevelopmentTeam = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          
          echo "Lancement de la compilation..."
          flutter build ios --release --no-codesign -v
          
      - name: 6. Création du fichier .ipa pour Sideloadly
        script: |
          echo "Préparation de l'IPA..."
          mkdir -p build/ios/ipa/Payload
          
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          else
            cp -R build/ios/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          fi
          
          echo "Compression en .ipa..."
          cd build/ios/ipa
          zip -r -q idle_nightclub.ipa Payload
          rm -rf Payload
          
          echo "🎉 SUCCÈS : Fichier idle_nightclub.ipa généré pour Sideloadly !"
          
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - test@example.com # Remplace bien par ton e-mail
        notify:
          success: true
          failure: true


