workflows:
  ios-unsigned-ipa:
    name: idle_nightclub
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: 1. Nettoyage absolu (Destruction des erreurs)
        script: |
          echo "Suppression totale des anciens fichiers et caches..."
          rm -rf ios
          rm -rf pubspec.lock
          flutter clean
          
      - name: 2. Recréation du projet iOS
        script: |
          echo "Création d'un projet iOS pur, vierge et sans corruption..."
          flutter create . --platforms ios
          
      - name: 3. Télécharger les dépendances
        script: |
          flutter pub get
          
      - name: 4. Compilation iOS (Sans signature)
        script: |
          echo "Désactivation manuelle de la signature dans Xcode..."
          # Sécurité supplémentaire : on efface toute trace d'équipe de développement dans le projet
          sed -i '' 's/DevelopmentTeam = .*/DevelopmentTeam = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          
          echo "Lancement de la compilation..."
          # Ajout du mode --verbose pour que, si par miracle ça plante, on ait l'erreur exacte et pas juste "Échec"
          flutter build ios --release --no-codesign -v
          
      - name: 5. Création du fichier .ipa pour Sideloadly
        script: |
          echo "Préparation de l'IPA..."
          mkdir -p build/ios/ipa/Payload
          
          # On cherche l'application générée et on la copie
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          else
            cp -R build/ios/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          fi
          
          echo "Compression en .ipa..."
          cd build/ios/ipa
          zip -r -q idle_nightclub.ipa Payload
          rm -rf Payload
          
          echo "🎉 SUCCÈS : Fichier idle_nightclub.ipa généré pour Sideloadly !"
          
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - test@example.com # Pense à mettre ton mail
        notify:
          success: true
          failure: true


